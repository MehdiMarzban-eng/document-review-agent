name: Windows installer fix
on:
  push:
    paths: ['.github/workflows/windows-installer-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Download and verify existing app payload
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://github.com/MehdiMarzban-eng/document-review-agent/releases/download/local-preview-v0.2.2/Document-Review-windows-x64.zip' -OutFile payload.zip
          $hash=(Get-FileHash payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '9233561f4b5247baa0c7253db7cb44eb5da29370c5246ad6bcfd449d24873de8'){throw 'Payload checksum mismatch'}
          @{version='windows-v0.2.3';url='https://github.com/MehdiMarzban-eng/document-review-agent/releases/download/local-preview-v0.2.2/Document-Review-windows-x64.zip';sha256=$hash} | ConvertTo-Json | Set-Content install.json
      - name: Compile fixed installer
        shell: pwsh
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:winexe /out:Document-Review-Setup.exe /resource:install.json,install.json /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.Web.Extensions.dll /reference:Microsoft.CSharp.dll 'local\windows_setup.cs'
          if($LASTEXITCODE -ne 0){throw 'Compilation failed'}
      - name: Extract full app with fixed installer
        shell: pwsh
        run: |
          $target=Join-Path $PWD 'extracted'
          $process=Start-Process -FilePath (Join-Path $PWD 'Document-Review-Setup.exe') -ArgumentList "--test-extract `"$PWD\payload.zip`" `"$target`"" -WindowStyle Hidden -Wait -PassThru
          if($process.ExitCode -ne 0){Get-Content payload.zip.error;throw 'Full payload extraction failed'}
          if(!(Test-Path "$target\python\pythonw.exe")){throw 'Missing installed runtime'}
          & "$target\python\python.exe" local/desktop_smoke.py "$target"
          if($LASTEXITCODE -ne 0){throw 'Desktop smoke failed'}
      - name: Publish fixed installer
        shell: pwsh
        run: |
          gh release create windows-v0.2.3 Document-Review-Setup.exe --prerelease --title 'Windows installer path fix' --notes 'Fixes Windows path-length errors during extraction. Shows approximate setup download sizes. Reuses the checksum-verified v0.2.2 app payload. Long-path regression tests, full app extraction and native-window smoke checks passed. No model download or local inference validation was performed.'
